# pasukkun - 단일 호스트 배포.
#   proxy  : 유일하게 외부에 열리는 컨테이너 (80/443). 프론트 정적 파일 + /api 프록시
#   api    : HTTP API. 호스트 포트를 열지 않는다 (내부 네트워크 전용)
#   worker : 수집·검사·알림 발송. 들어오는 요청 없이 외부로 나가는 호출만 한다
# DB 는 볼륨의 SQLite 파일 하나다. api 와 worker 는 같은 호스트의 같은 볼륨을 써야 한다.
name: pasukkun

x-server: &server
  build:
    context: .
    target: server
  image: pasukkun-server:local
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_PATH: /data/pasukkun.db
    PORT: "3000"
    # 컨테이너 안에서는 모든 인터페이스에 바인딩한다. 호스트 포트는 열지 않으므로 내부 네트워크에서만 닿는다.
    HOST: 0.0.0.0
    # 프록시 한 단계 뒤에 있다. 클라이언트 IP 는 프록시가 넘겨준 값을 쓴다.
    TRUST_PROXY: "1"
    # 파일시스템이 읽기 전용이므로 도구가 쓰는 캐시 위치를 tmpfs 로 돌리고, Prisma 사용 통계 전송을 끈다.
    HOME: /tmp
    CHECKPOINT_DISABLE: "1"
  volumes:
    - data:/data
    # GitHub 앱 개인 키 (.env 의 GITHUB_APP_PRIVATE_KEY_PATH=secrets/github-app.pem)
    - ./secrets:/app/secrets:ro
  networks:
    - internal
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *server
    # 기동 시 마이그레이션을 적용한 뒤 API 를 띄운다.
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy && node dist/main.js"]
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/auth/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *server
    command: ["node", "dist/worker.js"]
    depends_on:
      api:
        condition: service_healthy

  proxy:
    build:
      context: .
      target: proxy
    image: pasukkun-proxy:local
    environment:
      # 프론트 주소. 도메인을 넣으면 HTTPS 인증서를 자동 발급한다. .env 의 APP_ORIGIN 과 같은 주소여야 한다.
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

networks:
  internal:

volumes:
  data:
  caddy_data:
  caddy_config:
